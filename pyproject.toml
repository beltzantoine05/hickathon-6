[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hickathon6"
version = "1.0.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.41.5",
    "boto3-stubs==1.41.5",
    "botocore>=1.41.5",
    "catboost>=1.2.8",
    "joblib>=1.5.2",
    "notebook>=7.5.0",
    "pandas>=2.3.3",
    "pandas-stubs==2.3.2.250926",
    "plotly>=6.5.0",
    "python-dotenv>=1.2.1",
    "scikit-learn>=1.7.2",
    "wandb>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hickathon_six"]


[project.scripts]
hickathon6 = "hickathon_six.main:main"
